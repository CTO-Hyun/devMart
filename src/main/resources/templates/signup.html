<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.w3.org/1999/xhtml"
      layout:decorate="~{layout/default}">
<head>
    <meta charset="UTF-8">
    <title>회원가입 | devMart</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
    <link rel="stylesheet" th:href="@{/css/responsive.css}"/>
    <link crossorigin="anonymous" href="https://cdn.jsdelivr.net/npm/bootstrap@3.4.1/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body>
<section layout:fragment="content">
    <div class="container" style="max-width:400px;margin:60px auto;">
        <h2 style="text-align:center; margin-bottom:30px;">회원가입</h2>
        <form id="signup-form">
            <div class="form-group">
                <label for="username">아이디</label>
                <input class="form-control" id="username" name="username" required type="text">
            </div>
            <div class="form-group">
                <label for="password">비밀번호</label>
                <input class="form-control" id="password" name="password" required type="password">
            </div>
            <div class="form-group">
                <label for="name">이름</label>
                <input class="form-control" id="name" name="name" required type="text">
            </div>
            <div class="form-group">
                <label for="email">이메일</label>
                <input class="form-control" id="email" name="email" required type="email">
            </div>
            <button class="btn btn-primary btn-block" type="submit">회원가입</button>
        </form>
    </div>

    <script crossorigin="anonymous" src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script th:inline="javascript">
        $('#signup-form').on('submit', function (e) {
            e.preventDefault();
            var data = {
                username: $('#username').val(),
                password: $('#password').val(),
                email: $('#email').val()
            };
            $.ajax({
                url: '/signup',
                type: 'POST',
                contentType: 'application/json',
                data: JSON.stringify(data),
                success: function () {
                    alert('회원가입이 완료되었습니다. 로그인 해주세요.');
                    window.location.href = '/login';
                },
                error: function (xhr) {
                    alert('회원가입 실패: ' + (xhr.responseText || '오류'));
                }
            });
        });
    </script>
</section>
</body>
</html>
