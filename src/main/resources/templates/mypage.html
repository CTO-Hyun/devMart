<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.w3.org/1999/xhtml"
      layout:decorate="~{layout/default}">
<head>
    <meta charset="UTF-8">
    <title>마이페이지 | devMart</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
    <link rel="stylesheet" th:href="@{/css/responsive.css}"/>
    <link crossorigin="anonymous" href="https://cdn.jsdelivr.net/npm/bootstrap@3.4.1/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body>
<section layout:fragment="content">
    <div class="container" style="max-width:900px;margin:60px auto;">
        <h2 style="text-align:center; margin-bottom:30px;">마이페이지</h2>
        <ul class="nav nav-tabs" id="mypage-tabs" style="margin-left:0; margin-right:0;">
            <li class="active"><a data-toggle="tab" href="#info">내 정보</a></li>
            <li><a data-toggle="tab" href="#orders">주문내역</a></li>
            <li><a data-toggle="tab" href="#cart">장바구니</a></li>
            <li><a data-toggle="tab" href="#reviews">리뷰</a></li>
            <li><a data-toggle="tab" href="#qna">문의</a></li>
        </ul>
        <div class="tab-content" style="margin-top:20px;">
            <div class="tab-pane fade in active" id="info">
                <h4>내 정보</h4>
                <form id="user-info-form" class="form-horizontal" style="max-width:400px; margin:30px auto 20px auto; background:#fafbfc; padding:24px 28px 18px 28px; border-radius:10px; box-shadow:0 2px 8px #eee;">
                    <div class="form-group row" style="margin-bottom:18px;">
                        <label class="col-sm-4 col-form-label text-right">아이디</label>
                        <div class="col-sm-8"><input type="text" id="user-username" class="form-control" readonly></div>
                    </div>
                    <div class="form-group row" style="margin-bottom:18px;">
                        <label class="col-sm-4 col-form-label text-right">이름</label>
                        <div class="col-sm-8"><input type="text" id="user-name" class="form-control"></div>
                    </div>
                    <div class="form-group row" style="margin-bottom:18px;">
                        <label class="col-sm-4 col-form-label text-right">이메일</label>
                        <div class="col-sm-8"><input type="email" id="user-email" class="form-control"></div>
                    </div>
                    <div class="form-group row" style="margin-bottom:18px;">
                        <label class="col-sm-4 col-form-label text-right">비밀번호</label>
                        <div class="col-sm-8"><input type="password" id="user-password" class="form-control" placeholder="변경 시에만 입력"></div>
                    </div>
                    <div class="form-group row" style="margin-bottom:0;">
                        <div class="col-sm-12 text-center">
                            <button type="button" id="user-info-update" class="btn btn-primary" style="width:120px;">수정</button>
                        </div>
                    </div>
                </form>
                <div id="user-info-msg" style="margin-bottom:10px;text-align:center;"></div>
            </div>
            <div class="tab-pane fade" id="orders">
                <h4>주문내역</h4>
                <div style="margin-bottom:10px;">
                    <button id="order-delete-selected" class="btn btn-danger btn-sm">선택 삭제</button>
                </div>
                <div class="table-responsive" style="margin:20px 0;">
                    <table class="table table-bordered table-hover" id="orders-table">
                        <thead class="thead-light">
                        <tr>
                            <th><input type="checkbox" id="order-check-all"></th>
                            <th>주문번호</th>
                            <th>상품명</th>
                            <th>총금액</th>
                            <th>상태</th>
                            <th>취소</th>
                        </tr>
                        </thead>
                        <tbody id="mypage-orders"></tbody>
                    </table>
                </div>
            </div>
            <div class="tab-pane fade" id="cart">
                <h4>장바구니</h4>
                <div style="margin-bottom:10px;">
                    <button id="cart-delete-selected" class="btn btn-danger btn-sm">선택 삭제</button>
                </div>
                <div class="table-responsive" style="margin:20px 0;">
                    <table class="table table-bordered table-hover" id="cart-table">
                        <thead class="thead-light">
                        <tr>
                            <th><input type="checkbox" id="cart-check-all"></th>
                            <th>상품명</th>
                            <th>수량</th>
                            <th>가격</th>
                            <th>삭제</th>
                        </tr>
                        </thead>
                        <tbody id="mypage-cart"></tbody>
                    </table>
                </div>
            </div>
            <div class="tab-pane fade" id="reviews">
                <h4>내가 쓴 리뷰</h4>
                <div style="margin-bottom:10px;">
                    <button id="review-delete-selected" class="btn btn-danger btn-sm">선택 삭제</button>
                </div>
                <div class="table-responsive" style="margin:20px 0;">
                    <table class="table table-bordered table-hover" id="reviews-table">
                        <thead class="thead-light">
                        <tr>
                            <th><input type="checkbox" id="review-check-all"></th>
                            <th>상품명</th>
                            <th>별점</th>
                            <th>내용</th>
                            <th>수정/삭제</th>
                        </tr>
                        </thead>
                        <tbody id="mypage-reviews"></tbody>
                    </table>
                </div>
            </div>
            <div class="tab-pane fade" id="qna">
                <h4>내가 쓴 문의</h4>
                <div style="margin-bottom:10px;">
                    <button id="qna-delete-selected" class="btn btn-danger btn-sm">선택 삭제</button>
                </div>
                <div class="table-responsive" style="margin:20px 0;">
                    <table class="table table-bordered table-hover" id="qna-table">
                        <thead class="thead-light">
                        <tr>
                            <th><input type="checkbox" id="qna-check-all"></th>
                            <th>상품명</th>
                            <th>질문</th>
                            <th>답변</th>
                            <th>수정/삭제</th>
                        </tr>
                        </thead>
                        <tbody id="mypage-qna"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script crossorigin="anonymous" src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script crossorigin="anonymous"
            src="https://cdn.jsdelivr.net/npm/bootstrap@3.4.1/dist/js/bootstrap.min.js"></script>
    <script th:inline="javascript">
        $(function () {
            loadUserInfo();
        });

        function loadUserInfo() {
            $.get('/mypage/user', function (info) {
                $('#user-username').val(info.username || '');
                $('#user-name').val(info.name || '');
                $('#user-email').val(info.email || '');
                $('#user-password').val('');
            });
        }

        function loadMyOrders() {
            $.get('/order/list', function (list) {
                var html = '';
                for (var i = 0; i < list.length; i++) {
                    var o = list[i];
                    html += '<tr>' +
                        '<td><input type="checkbox" class="order-check" value="' + o.orderSeq + '"></td>' +
                        '<td>' + (o.orderSeq || '') + '</td>' +
                        '<td>' + (o.productName || '-') + '</td>' +
                        '<td>' + (o.totalPrice ? o.totalPrice.toLocaleString() : 0) + '원</td>' +
                        '<td>' + (o.status || '') + '</td>' +
                        '<td>' +
                        '<button class="btn btn-xs btn-danger mypage-order-del" data-order-seq="' + o.orderSeq + '">취소</button>' +
                        '</td>' +
                        '</tr>';
                }
                $('#mypage-orders').html(html);
            });
        }
        $('#order-check-all').on('change', function() {
            $('.order-check').prop('checked', this.checked);
        });
        $('#order-delete-selected').on('click', function() {
            var ids = $('.order-check:checked').map(function(){return $(this).val();}).get();
            if(ids.length === 0) return alert('삭제할 주문을 선택하세요.');
            if(!confirm('선택한 주문을 삭제하시겠습니까?')) return;
            $.ajax({ url:'/order/delete', type:'POST', contentType:'application/json', data:JSON.stringify({ids:ids}), success:loadMyOrders });
        });

        function loadMyCart() {
            $.get('/cart/list', function (list) {
                var html = '';
                for (var i = 0; i < list.length; i++) {
                    var c = list[i];
                    html += '<tr>' +
                        '<td><input type="checkbox" class="cart-check" value="' + c.cartSeq + '"></td>' +
                        '<td>' + (c.productName || '') + '</td>' +
                        '<td>' + c.quantity + '</td>' +
                        '<td>' + (c.price ? c.price.toLocaleString() : 0) + '원</td>' +
                        '<td>' +
                        '<button class="btn btn-xs btn-danger mypage-cart-del" data-cart-seq="' + c.cartSeq + '">삭제</button>' +
                        '</td>' +
                        '</tr>';
                }
                $('#mypage-cart').html(html);
            });
        }
        $('#cart-check-all').on('change', function() {
            $('.cart-check').prop('checked', this.checked);
        });
        $('#cart-delete-selected').on('click', function() {
            var ids = $('.cart-check:checked').map(function(){return $(this).val();}).get();
            if(ids.length === 0) return alert('삭제할 상품을 선택하세요.');
            if(!confirm('선택한 상품을 삭제하시겠습니까?')) return;
            $.ajax({ url:'/cart/delete', type:'POST', contentType:'application/json', data:JSON.stringify({ids:ids}), success:loadMyCart });
        });

        function loadMyReviews() {
            $.get('/review/list', function (list) {
                var html = '';
                for (var i = 0; i < list.length; i++) {
                    var r = list[i];
                    html += '<tr>' +
                        '<td><input type="checkbox" class="review-check" value="' + r.reviewSeq + '"></td>' +
                        '<td>' + (r.productName || '-') + '</td>' +
                        '<td>' + (r.rating || '') + '</td>' +
                        '<td>' + (r.content || '') + '</td>' +
                        '<td>' +
                        '<button class="btn btn-xs btn-warning mypage-review-edit" data-review-seq="' + r.reviewSeq + '" data-rating="' + (r.rating || '') + '" data-content="' + (r.content || '') + '">수정</button> ' +
                        '<button class="btn btn-xs btn-danger mypage-review-del" data-review-seq="' + r.reviewSeq + '">삭제</button>' +
                        '</td>' +
                        '</tr>';
                }
                $('#mypage-reviews').html(html);
            });
        }
        $('#review-check-all').on('change', function() {
            $('.review-check').prop('checked', this.checked);
        });
        $('#review-delete-selected').on('click', function() {
            var ids = $('.review-check:checked').map(function(){return $(this).val();}).get();
            if(ids.length === 0) return alert('삭제할 리뷰를 선택하세요.');
            if(!confirm('선택한 리뷰를 삭제하시겠습니까?')) return;
            $.ajax({ url:'/review/delete', type:'POST', contentType:'application/json', data:JSON.stringify({ids:ids}), success:loadMyReviews });
        });

        $(document).on('click', '.mypage-review-edit', function () {
            var reviewSeq = $(this).data('review-seq');
            var rating = prompt('별점 수정(1~5)', $(this).data('rating'));
            var content = prompt('리뷰 내용 수정', $(this).data('content'));
            if (rating && content) {
                $.ajax({
                    url: '/review/update',
                    type: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify({reviewSeq: reviewSeq, rating: rating, content: content}),
                    success: loadMyReviews
                });
            }
        });

        $(document).on('click', '.mypage-review-del', function () {
            var reviewSeq = $(this).data('review-seq');
            if (confirm('리뷰를 삭제하시겠습니까?')) {
                $.ajax({
                    url: '/review/delete',
                    type: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify({reviewSeq: reviewSeq}),
                    success: loadMyReviews
                });
            }
        });

        function loadMyQna() {
            $.get('/qna/list', function (list) {
                var html = '';
                for (var i = 0; i < list.length; i++) {
                    var q = list[i];
                    html += '<tr>' +
                        '<td><input type="checkbox" class="qna-check" value="' + q.qnaSeq + '"></td>' +
                        '<td>' + (q.productName || '-') + '</td>' +
                        '<td>' + (q.question || '') + '</td>' +
                        '<td>' + (q.answer || '-') + '</td>' +
                        '<td>' +
                        '<button class="btn btn-xs btn-warning mypage-qna-edit" data-qna-seq="' + q.qnaSeq + '" data-question="' + (q.question || '') + '">수정</button> ' +
                        '<button class="btn btn-xs btn-danger mypage-qna-del" data-qna-seq="' + q.qnaSeq + '">삭제</button>' +
                        '</td>' +
                        '</tr>';
                }
                $('#mypage-qna').html(html);
            });
        }
        $('#qna-check-all').on('change', function() {
            $('.qna-check').prop('checked', this.checked);
        });
        $('#qna-delete-selected').on('click', function() {
            var ids = $('.qna-check:checked').map(function(){return $(this).val();}).get();
            if(ids.length === 0) return alert('삭제할 문의를 선택하세요.');
            if(!confirm('선택한 문의를 삭제하시겠습니까?')) return;
            $.ajax({ url:'/qna/delete', type:'POST', contentType:'application/json', data:JSON.stringify({ids:ids}), success:loadMyQna });
        });

        $(document).on('click', '.mypage-qna-edit', function () {
            var qnaSeq = $(this).data('qna-seq');
            var question = prompt('문의 내용 수정', $(this).data('question'));
            if (question) {
                $.ajax({
                    url: '/qna/update',
                    type: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify({qnaSeq: qnaSeq, question: question}),
                    success: loadMyQna
                });
            }
        });

        $(document).on('click', '.mypage-qna-del', function () {
            var qnaSeq = $(this).data('qna-seq');
            if (confirm('문의를 삭제하시겠습니까?')) {
                $.ajax({
                    url: '/qna/delete',
                    type: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify({qnaSeq: qnaSeq}),
                    success: loadMyQna
                });
            }
        });

        $('#mypage-tabs a').click(function (e) {
            e.preventDefault();
            $(this).tab('show');
            var id = $(this).attr('href');
            if (id === "#info") loadUserInfo();
            else if (id === "#orders") loadMyOrders();
            else if (id === "#cart") loadMyCart();
            else if (id === "#reviews") loadMyReviews();
            else if (id === "#qna") loadMyQna();
        });

        // 주문내역 등록/수정 폼 및 기능
        
        $(document).on('click', '.mypage-order-edit', function () {
            var orderSeq = $(this).data('order-seq');
            var status = prompt('주문 상태 수정', $(this).data('status'));
            if (status) {
                $.ajax({
                    url: '/order/update',
                    type: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify({orderSeq: orderSeq, status: status}),
                    success: loadMyOrders
                });
            }
        });

        $(document).on('click', '.mypage-order-del', function () {
            var orderSeq = $(this).data('order-seq');
            if (confirm('주문을 삭제하시겠습니까?')) {
                $.ajax({
                    url: '/order/delete',
                    type: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify({orderSeq: orderSeq}),
                    success: loadMyOrders
                });
            }
        });

        // 장바구니 등록/수정 폼 및 기능
        // 등록/생성 폼 및 버튼 완전 삭제

        $(document).on('click', '.mypage-cart-edit', function () {
            var cartSeq = $(this).data('cart-seq');
            var quantity = prompt('수량 수정', $(this).data('quantity'));
            if (quantity) {
                $.ajax({
                    url: '/cart/update',
                    type: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify({cartSeq: cartSeq, quantity: quantity}),
                    success: loadMyCart
                });
            }
        });

        $(document).on('click', '.mypage-cart-del', function () {
            var cartSeq = $(this).data('cart-seq');
            if (confirm('장바구니에서 삭제하시겠습니까?')) {
                $.ajax({
                    url: '/cart/delete',
                    type: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify({cartSeq: cartSeq}),
                    success: loadMyCart
                });
            }
        });

        // 리뷰 등록/수정 폼 및 기능
        // 등록/생성 폼 및 버튼 완전 삭제

        // 문의 등록/수정 폼 및 기능
        // 등록/생성 폼 및 버튼 완전 삭제

        $('#user-info-update').click(function () {
            var name = $('#user-name').val();
            var email = $('#user-email').val();
            var password = $('#user-password').val();
            $.ajax({
                url: '/mypage/user/update',
                type: 'POST',
                contentType: 'application/json',
                data: JSON.stringify({ name: name, email: email, password: password }),
                success: function (res) {
                    $('#user-info-msg').html('<span style="color:green;">수정되었습니다.</span>');
                    loadUserInfo();
                },
                error: function () {
                    $('#user-info-msg').html('<span style="color:red;">수정 실패</span>');
                }
            });
        });
    </script>
</section>
</body>
</html>
