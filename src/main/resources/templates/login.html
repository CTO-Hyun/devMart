<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>로그인 | DEVMART</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
    <link rel="stylesheet" th:href="@{/css/responsive.css}"/>
    <link crossorigin="anonymous" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"
          rel="stylesheet">
    <link crossorigin="anonymous" href="https://cdn.jsdelivr.net/npm/bootstrap@3.4.1/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body>
<div th:replace="layout/header :: header"></div>
<div class="container" style="max-width:400px;margin:100px auto 60px auto;">
    <h2 style="text-align:center; margin-bottom:30px;">로그인</h2>
    <form method="post" th:action="@{/login}">
        <div class="form-group" style="margin-bottom:20px;">
            <label for="username">아이디</label>
            <input autofocus class="form-control" id="username" name="username" required type="text"/>
        </div>
        <div class="form-group" style="margin-bottom:20px;">
            <label for="password">비밀번호</label>
            <input class="form-control" id="password" name="password" required type="password"/>
        </div>
        <div class="alert alert-danger" style="margin-bottom:15px;" th:if="${param.error}">아이디 또는 비밀번호가 올바르지 않습니다.</div>
        <button class="btn btn-primary btn-block" style="width:100%;" type="submit">로그인</button>
    </form>
</div>
<div th:replace="layout/footer :: footer"></div>
</body>
</html>
