<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>리뷰/문의 | devMart</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
    <link rel="stylesheet" th:href="@{/css/responsive.css}"/>
    <link crossorigin="anonymous" href="https://cdn.jsdelivr.net/npm/bootstrap@3.4.1/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body>
<div th:replace="layout/header :: header"></div>
<section>
    <div class="container" style="max-width:900px;margin:60px auto;">
        <h2 style="text-align:center; margin-bottom:30px;">리뷰/문의</h2>
        <ul class="nav nav-tabs" id="review-tabs">
            <li class="active"><a data-toggle="tab" href="#reviews">리뷰</a></li>
            <li><a data-toggle="tab" href="#qna">문의</a></li>
        </ul>
        <div class="tab-content" style="margin-top:20px;">
            <div class="tab-pane fade in active" id="reviews">
                <h4>내 리뷰</h4>
                <div id="review-list"></div>
                <h5>리뷰 작성</h5>
                <form id="review-form">
                    <input id="review-product" placeholder="상품명" required type="text">
                    <input id="review-rating" max="5" min="1" placeholder="별점(1~5)" required type="number">
                    <input id="review-content" placeholder="리뷰 내용" required type="text">
                    <button class="btn btn-primary btn-sm" type="submit">작성</button>
                </form>
            </div>
            <div class="tab-pane fade" id="qna">
                <h4>내 문의</h4>
                <div id="qna-list"></div>
                <h5>문의 작성</h5>
                <form id="qna-form">
                    <input id="qna-product" placeholder="상품명" required type="text">
                    <input id="qna-question" placeholder="문의 내용" required type="text">
                    <button class="btn btn-primary btn-sm" type="submit">작성</button>
                </form>
            </div>
        </div>
    </div>

    <script crossorigin="anonymous" src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script crossorigin="anonymous"
            src="https://cdn.jsdelivr.net/npm/bootstrap@3.4.1/dist/js/bootstrap.min.js"></script>
    <script th:inline="javascript">
        $(function () {
            loadReviewList();
        });

        function loadReviewList() {
            $.get('/review/list', function (list) {
                var html = '<ul>';
                for (var i = 0; i < list.length; i++) {
                    var r = list[i];
                    html += '<li>' + (r.productName || '') + ' / ' + (r.rating || '') + '점 / ' + (r.content || '') + '</li>';
                }
                html += '</ul>';
                $('#review-list').html(html);
            });
        }

        function loadQnaList() {
            $.get('/qna/list', function (list) {
                var html = '<ul>';
                for (var i = 0; i < list.length; i++) {
                    var q = list[i];
                    html += '<li>' + (q.productName || '') + ' / ' + (q.question || '') + ' / 답변: ' + (q.answer || '-') + '</li>';
                }
                html += '</ul>';
                $('#qna-list').html(html);
            });
        }

        $('#review-form').on('submit', function (e) {
            e.preventDefault();
            var data = {
                productName: $('#review-product').val(),
                rating: $('#review-rating').val(),
                content: $('#review-content').val()
            };
            $.ajax({
                url: '/review/create',
                type: 'POST',
                contentType: 'application/json',
                data: JSON.stringify(data),
                success: function () {
                    alert('리뷰가 등록되었습니다.');
                    loadReviewList();
                },
                error: function () {
                    alert('리뷰 등록 실패');
                }
            });
        });

        $('#qna-form').on('submit', function (e) {
            e.preventDefault();
            var data = {
                productName: $('#qna-product').val(),
                question: $('#qna-question').val()
            };
            $.ajax({
                url: '/qna/create',
                type: 'POST',
                contentType: 'application/json',
                data: JSON.stringify(data),
                success: function () {
                    alert('문의가 등록되었습니다.');
                    loadQnaList();
                },
                error: function () {
                    alert('문의 등록 실패');
                }
            });
        });

        $('#review-tabs a').click(function (e) {
            e.preventDefault();
            $(this).tab('show');
            var id = $(this).attr('href');
            if (id === "#reviews") loadReviewList();
            else if (id === "#qna") loadQnaList();
        });

    </script>
</section>
<div th:replace="layout/footer :: footer"></div>
</body>
</html>
