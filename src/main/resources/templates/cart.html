<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>장바구니 | devMart</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
    <link rel="stylesheet" th:href="@{/css/responsive.css}"/>
    <link crossorigin="anonymous" href="https://cdn.jsdelivr.net/npm/bootstrap@3.4.1/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body>
<div th:replace="layout/header :: header"></div>
<div class="container" style="max-width:900px;margin:60px auto;">
    <h2 style="text-align:center; margin-bottom:30px;">장바구니</h2>
    <table class="table table-bordered table-hover">
        <thead>
        <tr>
            <th>상품명</th>
            <th>수량</th>
            <th>가격</th>
            <th>합계</th>
            <th>삭제</th>
        </tr>
        </thead>
        <tbody id="cart-list"></tbody>
        <tfoot>
        <tr>
            <td colspan="5" id="cart-summary" style="text-align:right;"></td>
        </tr>
        </tfoot>
    </table>
    <button class="btn btn-danger pull-right" id="cart-clear-btn">장바구니 전체 비우기</button>
</div>
<div th:replace="layout/footer :: footer"></div>

<script crossorigin="anonymous" src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script th:inline="javascript">
    $(function () {
        loadCart();
    });

    function loadCart() {
        $.get('/cart/list', function (list) {
            var html = '';
            var totalCount = 0;
            var totalPrice = 0;
            for (var i = 0; i < list.length; i++) {
                var item = list[i];
                html += '<tr>' +
                    '<td>' + (item.productName || '') + '</td>' +
                    '<td><input type="number" min="1" value="' + item.quantity + '" class="cart-qty-input" data-id="' + item.id + '" style="width:60px;"/></td>' +
                    '<td>' + (item.price ? item.price.toLocaleString() : 0) + '원</td>' +
                    '<td>' + ((item.price * item.quantity) ? (item.price * item.quantity).toLocaleString() : 0) + '원</td>' +
                    '<td><button class="btn btn-xs btn-danger cart-delete-btn" data-id="' + item.id + '">삭제</button></td>' +
                    '</tr>';
                totalCount += item.quantity;
                totalPrice += (item.price * item.quantity) || 0;
            }
            $('#cart-list').html(html);
            $('#cart-summary').html('총 ' + totalCount + '건 / ' + totalPrice.toLocaleString() + '원');
        });
    }

    $(document).on('change', '.cart-qty-input', function () {
        var id = $(this).data('id');
        var qty = $(this).val();
        $.ajax({
            url: '/cart/update',
            type: 'POST',
            contentType: 'application/json',
            data: JSON.stringify({id: id, quantity: qty}),
            success: function () {
                loadCart();
            },
            error: function () {
                alert('수량 변경 실패');
            }
        });
    });

    $(document).on('click', '.cart-delete-btn', function () {
        var id = $(this).data('id');
        $.ajax({
            url: '/cart/delete',
            type: 'POST',
            contentType: 'application/json',
            data: JSON.stringify({id: id}),
            success: function () {
                loadCart();
            },
            error: function () {
                alert('삭제 실패');
            }
        });
    });

    $('#cart-clear-btn').on('click', function () {
        if (confirm('장바구니를 모두 비우시겠습니까?')) {
            $.post('/cart/clear', function () {
                loadCart();
            });
        }
    });
</script>
</body>
</html>
