<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.w3.org/1999/xhtml"
      layout:decorate="~{layout/default}">
<head>
    <meta charset="UTF-8">
    <title>장바구니 | devMart</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
    <link rel="stylesheet" th:href="@{/css/responsive.css}"/>
    <link crossorigin="anonymous" href="https://cdn.jsdelivr.net/npm/bootstrap@3.4.1/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body>
<div class="container" style="max-width:900px;margin:60px auto;" layout:fragment="content">
    <h2 style="text-align:center; margin-bottom:30px;">장바구니</h2>
    <table class="table table-bordered table-hover">
        <thead>
        <tr>
            <th>상품명</th>
            <th>수량</th>
            <th>가격</th>
            <th>합계</th>
            <th>삭제</th>
        </tr>
        </thead>
        <tbody id="cart-list"></tbody>
        <tfoot>
        <tr>
            <td colspan="5" id="cart-summary" style="text-align:right;"></td>
        </tr>
        </tfoot>
    </table>
    <div id="cart-empty-msg" style="display:none; text-align:center; color:#888; margin:30px 0;">장바구니가 비어있습니다.</div>
    <button class="btn btn-primary" id="cart-order-btn" style="float:left;">장바구니 전체 구매</button>
    <button class="btn btn-danger pull-right" id="cart-clear-btn">장바구니 전체 비우기</button>
</div>

<script crossorigin="anonymous" src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script th:inline="javascript">
    $(function () {
        loadCart();

        // 로그인 체크 함수
        function isLoggedIn() {
            // 세션/쿠키/로컬스토리지 등에서 로그인 여부 판단 (임시: 서버에서 401/403 응답 시로 대체)
            return true;
        }

        // 장바구니 전체 구매(주문)
        $('#cart-order-btn').off('click').on('click', function () {
            if (!isLoggedIn()) {
                alert('로그인 후 이용 가능합니다.');
                return;
            }
            $.get('/cart/list', function (list) {
                if (list.length === 0) {
                    alert('장바구니가 비어있습니다.');
                    return;
                }
                var items = [];
                var totalPrice = 0;
                for (var i = 0; i < list.length; i++) {
                    var item = list[i];
                    var qty = parseInt(item.quantity) || 0;
                    var price = parseInt(item.price) || 0;
                    items.push({ productId: item.productId, quantity: qty, price: price });
                    totalPrice += price * qty;
                }
                $.ajax({
                    url: '/order/create',
                    type: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify({ totalPrice: totalPrice, items: items }),
                    success: function () {
                        alert('주문이 완료되었습니다.');
                        loadCart();
                    },
                    error: function (xhr) {
                        alert('주문 실패: ' + xhr.status + '\n' + (xhr.responseText || '서버 오류'));
                    }
                });
            });
        });

        // 장바구니 전체 비우기
        $('#cart-clear-btn').off('click').on('click', function () {
            if (!isLoggedIn()) {
                alert('로그인 후 이용 가능합니다.');
                return;
            }
            if (confirm('장바구니를 모두 비우시겠습니까?')) {
                $.ajax({
                    url: '/cart/clear',
                    type: 'POST',
                    success: function () {
                        loadCart();
                    },
                    error: function (xhr) {
                        alert('장바구니 비우기 실패: ' + xhr.status + '\n' + (xhr.responseText || '서버 오류'));
                    }
                });
            }
        });
    });

    function loadCart() {
        $.get('/cart/list', function (list) {
            var html = '';
            var totalCount = 0;
            var totalPrice = 0;
            for (var i = 0; i < list.length; i++) {
                var item = list[i];
                var qty = parseInt(item.quantity) || 0;
                var price = parseInt(item.price) || 0;
                html += '<tr>' +
                    '<td><a href="/product/detail?productId=' + item.productId + '" style="color:#337ab7; text-decoration:underline;">' + (item.productName || '') + '</a></td>' +
                    '<td><input type="number" min="1" value="' + qty + '" class="cart-qty-input" data-id="' + item.id + '" style="width:60px;"/></td>' +
                    '<td>' + price.toLocaleString() + '원</td>' +
                    '<td>' + (price * qty).toLocaleString() + '원</td>' +
                    '<td><button class="btn btn-xs btn-danger cart-delete-btn" data-id="' + item.id + '">삭제</button></td>' +
                    '</tr>';
                totalCount += qty;
                totalPrice += price * qty;
            }
            $('#cart-list').html(html);
            $('#cart-summary').html('총 ' + totalCount + '건 / ' + totalPrice.toLocaleString() + '원');
            if (list.length === 0) {
                $('#cart-empty-msg').show();
                $('#cart-order-btn').prop('disabled', true);
            } else {
                $('#cart-empty-msg').hide();
                $('#cart-order-btn').prop('disabled', false);
            }
        });
    }

    $(document).on('change', '.cart-qty-input', function () {
        var id = $(this).data('id');
        var qty = $(this).val();
        $.ajax({
            url: '/cart/update',
            type: 'POST',
            contentType: 'application/json',
            data: JSON.stringify({id: id, quantity: qty}),
            success: function () {
                loadCart();
            },
            error: function () {
                alert('수량 변경 실패');
            }
        });
    });

    $(document).on('click', '.cart-delete-btn', function () {
        var id = $(this).data('id');
        $.ajax({
            url: '/cart/delete',
            type: 'POST',
            contentType: 'application/json',
            data: JSON.stringify({id: id}),
            success: function () {
                loadCart();
            },
            error: function () {
                alert('삭제 실패');
            }
        });
    });
</script>
</body>
</html>
