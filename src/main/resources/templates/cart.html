<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.w3.org/1999/xhtml"
      layout:decorate="~{layout/default}">
<head>
    <meta charset="UTF-8">
    <title>장바구니 | devMart</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
    <link rel="stylesheet" th:href="@{/css/responsive.css}"/>
    <link crossorigin="anonymous" href="https://cdn.jsdelivr.net/npm/bootstrap@3.4.1/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body>
<div class="container" style="max-width:900px;margin:60px auto;" layout:fragment="content">
    <h2 style="text-align:center; margin-bottom:30px;">장바구니</h2>
    <table class="table table-bordered table-hover">
        <thead>
        <tr>
            <th>상품명</th>
            <th>수량</th>
            <th>가격</th>
            <th>합계</th>
            <th>삭제</th>
        </tr>
        </thead>
        <tbody id="cart-list">
        <tr th:each="item : ${cartList}">
            <td><a th:href="@{/product/detail(productId=${item['productId']})}" th:text="${item['productName']}"></a></td>
            <td>
                <input type="number" min="1" name="quantity" th:value="${item['quantity']}" class="cart-qty-input" th:data-id="${item['cartId']}" style="width:60px;display:inline-block;"/>
            </td>
            <td class="cart-price" th:data-price="${item['price']}" th:text="${#numbers.formatInteger(item['price'], 0, 'COMMA')} + '원'"></td>
            <td class="cart-sum" th:text="${#numbers.formatInteger(item['price'] * item['quantity'], 0, 'COMMA')} + '원'"></td>
            <td>
                <button class="btn btn-xs btn-danger cart-delete-btn" th:data-id="${item['cartId']}">삭제</button>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(cartList)}">
            <td colspan="5" style="text-align:center; color:#888;">장바구니가 비어있습니다.</td>
        </tr>
        <tr th:if="${not #lists.isEmpty(cartList)}">
            <td colspan="5" style="text-align:right;">
                <span id="cart-summary-total">총 <span id="cart-total-count">0</span>건 / <span id="cart-total-price">0</span>원</span>
            </td>
        </tr>
        </tbody>
        <tfoot>
        <tr th:if="${not #lists.isEmpty(cartList)}">
            <td colspan="5" style="text-align:right;">
                <button type="button" class="btn btn-danger" id="cart-clear-btn">장바구니 전체 비우기</button>
                <button type="button" class="btn btn-primary" id="cart-order-btn" style="margin-left:10px;">장바구니 전체 구매</button>
            </td>
        </tr>
        </tfoot>
    </table>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
    function updateCartSummary() {
        var totalCount = 0, totalPrice = 0;
        $('.cart-qty-input').each(function() {
            var q = parseInt($(this).val()) || 0;
            var p = parseInt($(this).closest('tr').find('.cart-price').data('price')) || 0;
            totalCount += q;
            totalPrice += q * p;
        });
        $('#cart-total-count').text(totalCount);
        $('#cart-total-price').text(totalPrice.toLocaleString());
    }
    $(document).on('input', '.cart-qty-input', function() {
        var row = $(this).closest('tr');
        var qty = parseInt($(this).val()) || 0;
        var price = parseInt(row.find('.cart-price').data('price')) || 0;
        row.find('.cart-sum').text((price * qty).toLocaleString() + '원');
        updateCartSummary();
    });
    $(function() { updateCartSummary(); });

    // 장바구니 전체 비우기
    $(document).on('click', '#cart-clear-btn', function() {
        if (confirm('장바구니를 모두 비우시겠습니까?')) {
            $.ajax({
                url: '/cart/clear',
                type: 'POST',
                contentType: 'application/json',
                data: '{}',
                success: function(res) {
                    if(res.success) location.reload();
                    else alert('장바구니 비우기 실패: ' + (res.message || '서버 오류'));
                },
                error: function(xhr) {
                    alert('장바구니 비우기 실패: ' + (xhr.responseJSON && xhr.responseJSON.message ? xhr.responseJSON.message : '서버 오류'));
                }
            });
        }
    });
    // 장바구니 전체 구매
    $(document).on('click', '#cart-order-btn', function() {
        var items = [];
        var totalPrice = 0;
        $('.cart-qty-input').each(function() {
            var row = $(this).closest('tr');
            var productId = row.find('.cart-delete-btn').data('id');
            var qty = parseInt($(this).val()) || 0;
            var price = parseInt(row.find('.cart-price').data('price')) || 0;
            items.push({ productId: productId, quantity: qty, price: price });
            totalPrice += qty * price;
        });
        if(items.length === 0) {
            alert('장바구니가 비어있습니다.');
            return;
        }
        $.ajax({
            url: '/order/create',
            type: 'POST',
            contentType: 'application/json',
            data: JSON.stringify({ totalPrice: totalPrice, items: items }),
            success: function(res) {
                if(res.success) {
                    alert('주문이 완료되었습니다.');
                    location.reload();
                } else {
                    alert('주문 실패: ' + (res.message || '서버 오류'));
                }
            },
            error: function(xhr) {
                alert('주문 실패: ' + (xhr.responseJSON && xhr.responseJSON.message ? xhr.responseJSON.message : '서버 오류'));
            }
        });
    });
    // 장바구니 삭제
    $(document).on('click', '.cart-delete-btn', function() {
        var id = $(this).data('id');
        $.ajax({
            url: '/cart/delete',
            type: 'POST',
            contentType: 'application/json',
            data: JSON.stringify({ id: id }),
            success: function(res) {
                if(res.success) location.reload();
                else alert('삭제 실패: ' + (res.message || '서버 오류'));
            },
            error: function(xhr) {
                alert('삭제 실패: ' + (xhr.responseJSON && xhr.responseJSON.message ? xhr.responseJSON.message : '서버 오류'));
            }
        });
    });

    // 장바구니 수량 변경
    $(document).on('change', '.cart-qty-input', function() {
        var id = $(this).data('id');
        console.log($(this));
        console.log(id);
        var qty = parseInt($(this).val()) || 0;
        $.ajax({
            url: '/cart/update',
            type: 'POST',
            contentType: 'application/json',
            data: JSON.stringify({ id: id, quantity: qty }),
            success: function(res) {
                if(!res.success) alert('수량 변경 실패: ' + (res.message || '서버 오류'));
            },
            error: function(xhr) {
                alert('수량 변경 실패: ' + (xhr.responseJSON && xhr.responseJSON.message ? xhr.responseJSON.message : '서버 오류'));
            }
        });
    });
    </script>
</div>
</body>
</html>
