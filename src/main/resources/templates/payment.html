<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.w3.org/1999/xhtml"
      layout:decorate="~{layout/default}">
<head>
    <meta charset="UTF-8">
    <title>결제내역 | devMart</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
    <link rel="stylesheet" th:href="@{/css/responsive.css}"/>
    <link crossorigin="anonymous" href="https://cdn.jsdelivr.net/npm/bootstrap@3.4.1/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body>
<section layout:fragment="content">
    <div class="container" style="max-width:900px;margin:60px auto;">
        <h2 style="text-align:center; margin-bottom:30px;">결제내역</h2>
        <table class="table table-bordered table-hover">
            <thead>
            <tr>
                <th>결제번호</th>
                <th>주문번호</th>
                <th>결제금액</th>
                <th>상태</th>
                <th>결제일시</th>
                <th>상세</th>
            </tr>
            </thead>
            <tbody id="payment-list"></tbody>
        </table>
        <div id="payment-detail" style="display:none; margin-top:40px;">
            <h4>결제 상세</h4>
            <div id="payment-detail-content"></div>
            <button class="btn btn-default" id="payment-detail-close">닫기</button>
        </div>
        <button class="btn btn-success pull-right" id="payment-create-btn">모의 결제하기</button>
    </div>

    <script crossorigin="anonymous" src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script th:inline="javascript">
        $(function () {
            loadPaymentList();
        });

        function loadPaymentList() {
            $.get('/payment/list', function (list) {
                var html = '';
                for (var i = 0; i < list.length; i++) {
                    var p = list[i];
                    html += '<tr>' +
                        '<td>' + (p.id || '') + '</td>' +
                        '<td>' + (p.orderId || '') + '</td>' +
                        '<td>' + (p.amount ? p.amount.toLocaleString() : 0) + '원</td>' +
                        '<td>' + (p.status || '') + '</td>' +
                        '<td>' + (p.createDate || '') + '</td>' +
                        '<td><button class="btn btn-xs btn-info payment-detail-btn" data-id="' + p.id + '">상세</button></td>' +
                        '</tr>';
                }
                $('#payment-list').html(html);
            });
        }

        $(document).on('click', '.payment-detail-btn', function () {
            var paymentId = $(this).data('id');
            $.get('/payment/detail', {paymentId: paymentId}, function (detail) {
                var html = '<ul>';
                html += '<li>결제번호: ' + (detail.id || '') + '</li>';
                html += '<li>주문번호: ' + (detail.orderId || '') + '</li>';
                html += '<li>결제금액: ' + (detail.amount ? detail.amount.toLocaleString() : 0) + '원</li>';
                html += '<li>상태: ' + (detail.status || '') + '</li>';
                html += '<li>결제일시: ' + (detail.createDate || '') + '</li>';
                html += '</ul>';
                $('#payment-detail-content').html(html);
                $('#payment-detail').show();
            });
        });

        $('#payment-detail-close').on('click', function () {
            $('#payment-detail').hide();
        });

        $('#payment-create-btn').on('click', function () {
            var orderId = prompt('결제할 주문번호를 입력하세요.');
            if (orderId) {
                $.ajax({
                    url: '/payment/create',
                    type: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify({orderId: orderId}),
                    success: function () {
                        alert('결제가 완료되었습니다.');
                        loadPaymentList();
                    },
                    error: function () {
                        alert('결제 실패');
                    }
                });
            }
        });
    </script>
</section>
</body>
</html>
