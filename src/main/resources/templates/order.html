<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" layout:decorate="~{layout/default}">
<head>
    <meta charset="UTF-8">
    <title>주문내역 | devMart</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
    <link rel="stylesheet" th:href="@{/css/responsive.css}"/>
    <link crossorigin="anonymous" href="https://cdn.jsdelivr.net/npm/bootstrap@3.4.1/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body>
<section layout:fragment="content">
    <div class="container" style="max-width:900px;margin:60px auto;">
        <h2 style="text-align:center; margin-bottom:30px;">주문내역</h2>
        <table class="table table-bordered table-hover">
            <thead>
            <tr>
                <th>주문번호</th>
                <th>총금액</th>
                <th>상태</th>
                <th>주문일시</th>
                <th>상세</th>
            </tr>
            </thead>
            <tbody id="order-list"></tbody>
        </table>
        <div id="order-detail" style="display:none; margin-top:40px;">
            <h4>주문 상세</h4>
            <div id="order-detail-content"></div>
            <button class="btn btn-default" id="order-detail-close">닫기</button>
        </div>
        <button class="btn btn-success pull-right" id="order-create-btn">장바구니 상품 주문하기</button>
    </div>

    <script crossorigin="anonymous" src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script th:inline="javascript">
         $(function () {
            loadOrderList();
        });

        function loadOrderList() {
            $.get('/order/list', function (list) {
                var html = '';
                for (var i = 0; i < list.length; i++) {
                    var o = list[i];
                    html += '<tr>' +
                        '<td>' + (o.id || '') + '</td>' +
                        '<td>' + (o.totalPrice ? o.totalPrice.toLocaleString() : 0) + '원</td>' +
                        '<td>' + (o.status || '') + '</td>' +
                        '<td>' + (o.createDate || '') + '</td>' +
                        '<td><button class="btn btn-xs btn-info order-detail-btn" data-id="' + o.id + '">상세</button></td>' +
                        '</tr>';
                }
                $('#order-list').html(html);
            });
        }

        $(document).on('click', '.order-detail-btn', function () {
            var orderId = $(this).data('id');
            $.get('/order/detail', {orderId: orderId}, function (detail) {
                var html = '<ul>';
                html += '<li>주문번호: ' + (detail.id || '') + '</li>';
                html += '<li>총금액: ' + (detail.totalPrice ? detail.totalPrice.toLocaleString() : 0) + '원</li>';
                html += '<li>상태: ' + (detail.status || '') + '</li>';
                html += '<li>주문일시: ' + (detail.createDate || '') + '</li>';
                html += '<li>상품목록:<ul>';
                if (detail.orderItems) {
                    for (var i = 0; i < detail.orderItems.length; i++) {
                        var item = detail.orderItems[i];
                        html += '<li>' + (item.productName || '') + ' / ' + item.quantity + '개 / ' + (item.price ? item.price.toLocaleString() : 0) + '원</li>';
                    }
                }
                html += '</ul></li></ul>';
                $('#order-detail-content').html(html);
                $('#order-detail').show();
            });
        });

        $('#order-detail-close').on('click', function () {
            $('#order-detail').hide();
        });

        $('#order-create-btn').on('click', function () {
            if (confirm('장바구니 상품을 주문하시겠습니까?')) {
                $.get('/cart/list', function (cartList) {
                    if (cartList.length === 0) {
                        alert('장바구니가 비어있습니다.');
                        return;
                    }
                    var totalPrice = 0;
                    var items = [];
                    for (var i = 0; i < cartList.length; i++) {
                        var c = cartList[i];
                        totalPrice += (c.price * c.quantity) || 0;
                        items.push({
                            productId: c.productId,
                            productName: c.productName,
                            price: c.price,
                            quantity: c.quantity
                        });
                    }
                    $.ajax({
                        url: '/order/create',
                        type: 'POST',
                        contentType: 'application/json',
                        data: JSON.stringify({totalPrice: totalPrice, status: 'ORDERED', items: items}),
                        success: function () {
                            alert('주문이 완료되었습니다.');
                            loadOrderList();
                        },
                        error: function () {
                            alert('주문 실패');
                        }
                    });
                });
            }
        });
    </script>
</section>
</body>
</html>
