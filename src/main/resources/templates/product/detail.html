<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>상품 상세 | devMart</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
    <link rel="stylesheet" th:href="@{/css/responsive.css}"/>
    <link crossorigin="anonymous" href="https://cdn.jsdelivr.net/npm/bootstrap@3.4.1/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body>
<div th:replace="layout/header :: header"></div>
<section>
    <div class="container" style="max-width:900px;margin:60px auto;">
        <h2 th:text="${product.name}">상품명</h2>
        <div>
            <img style="max-width:300px;" th:src="@{${product.imageUrl}}">
            <p>가격: <span th:text="${product.price}"></span> 원</p>
            <p>설명: <span th:text="${product.description}"></span></p>
        </div>
        <ul class="nav nav-tabs" id="product-tabs">
            <li class="active"><a data-toggle="tab" href="#review">리뷰</a></li>
            <li><a data-toggle="tab" href="#qna">문의</a></li>
        </ul>
        <div class="tab-content" style="margin-top:20px;">
            <div class="tab-pane fade in active" id="review">
                <h4>리뷰</h4>
                <div id="review-list"></div>
                <div id="review-form">
                    <input id="review-rating" max="5" min="1" placeholder="별점(1~5)" type="number">
                    <input id="review-content" placeholder="리뷰 내용" style="width:300px;" type="text">
                    <button class="btn btn-sm btn-primary" id="review-submit">리뷰 등록</button>
                </div>
            </div>
            <div class="tab-pane fade" id="qna">
                <h4>문의</h4>
                <div id="qna-list"></div>
                <div id="qna-form">
                    <input id="qna-question" placeholder="문의 내용" style="width:300px;" type="text">
                    <button class="btn btn-sm btn-info" id="qna-submit">문의 등록</button>
                </div>
            </div>
        </div>
    </div>
    <script crossorigin="anonymous" src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script crossorigin="anonymous"
            src="https://cdn.jsdelivr.net/npm/bootstrap@3.4.1/dist/js/bootstrap.min.js"></script>

    <script th:inline="javascript">
        function loadReviews() {
            var productId = [[${product.id}]];
            $.get('/review/product', {productId: productId}, function (list) {
                var html = '<ul>';
                for (var i = 0; i < list.length; i++) {
                    var r = list[i];
                    html += '<li>[' + r.rating + '점] ' + (r.content || '') + ' - ' + (r.username || '') +
                        ' <button class="btn btn-xs btn-warning review-edit" data-id="' + r.id + '" data-content="' + (r.content || '') + '" data-rating="' + (r.rating || '') + '">수정</button>' +
                        ' <button class="btn btn-xs btn-danger review-del" data-id="' + r.id + '">삭제</button>' + '</li>';
                }
                html += '</ul>';
                $('#review-list').html(html);
            });
        }

        $(document).on('click', '.review-del', function () {
            var id = $(this).data('id');
            if (confirm('리뷰를 삭제하시겠습니까?')) {
                $.ajax({
                    url: '/review/delete',
                    type: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify({id: id}),
                    success: loadReviews
                });
            }
        });
        $(document).on('click', '.review-edit', function () {
            var id = $(this).data('id');
            var content = prompt('리뷰 내용 수정', $(this).data('content'));
            var rating = prompt('별점 수정(1~5)', $(this).data('rating'));
            if (content && rating) {
                $.ajax({
                    url: '/review/update',
                    type: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify({id: id, content: content, rating: rating}),
                    success: loadReviews
                });
            }
        });

        function loadQna() {
            var productId = [[${product.id}]];
            $.get('/qna/product', {productId: productId}, function (list) {
                var html = '<ul>';
                for (var i = 0; i < list.length; i++) {
                    var q = list[i];
                    html += '<li>' + (q.question || '') + ' / 답변: ' + (q.answer || '-') + ' - ' + (q.username || '') +
                        ' <button class="btn btn-xs btn-warning qna-edit" data-id="' + q.id + '" data-question="' + (q.question || '') + '">수정</button>' +
                        ' <button class="btn btn-xs btn-danger qna-del" data-id="' + q.id + '">삭제</button>' + '</li>';
                }
                html += '</ul>';
                $('#qna-list').html(html);
            });
        }

        $(document).on('click', '.qna-del', function () {
            var id = $(this).data('id');
            if (confirm('문의를 삭제하시겠습니까?')) {
                $.ajax({
                    url: '/qna/delete',
                    type: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify({id: id}),
                    success: loadQna
                });
            }
        });
        $(document).on('click', '.qna-edit', function () {
            var id = $(this).data('id');
            var question = prompt('문의 내용 수정', $(this).data('question'));
            if (question) {
                $.ajax({
                    url: '/qna/update',
                    type: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify({id: id, question: question}),
                    success: loadQna
                });
            }
        });
        $('#review-submit').click(function () {
            var productId = [[${product.id}]];
            var rating = $('#review-rating').val();
            var content = $('#review-content').val();
            $.ajax({
                url: '/review/create',
                type: 'POST',
                contentType: 'application/json',
                data: JSON.stringify({productId: productId, rating: rating, content: content}),
                success: function () {
                    loadReviews();
                    $('#review-content').val('');
                    $('#review-rating').val('');
                },
                error: function () {
                    alert('리뷰 등록 실패');
                }
            });
        });
        $('#qna-submit').click(function () {
            var productId = [[${product.id}]];
            var question = $('#qna-question').val();
            $.ajax({
                url: '/qna/create',
                type: 'POST',
                contentType: 'application/json',
                data: JSON.stringify({productId: productId, question: question}),
                success: function () {
                    loadQna();
                    $('#qna-question').val('');
                },
                error: function () {
                    alert('문의 등록 실패');
                }
            });
        });
        $('#product-tabs a').click(function (e) {
            e.preventDefault();
            $(this).tab('show');
            var id = $(this).attr('href');
            if (id === "#review") loadReviews();
            else if (id === "#qna") loadQna();
        });
        $(function () {
            loadReviews();
        });
    </script>
    <div th:replace="layout/footer :: footer"></div>
</section>
</body>
</html>
